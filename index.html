 --sh2:0 6px 16px rgba(0,0,0,.06),0 18px 44px rgba(0,0,0,.08);
 --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","InterLocal","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 16px/1.47 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid rgba(0,113,227,.45);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
h1{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.025em}
h2{font-size:21px;line-height:1.25;font-weight:600;letter-spacing:-.018em}
h3{font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.012em}
b{font-weight:600}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.t1{color:var(--text)}.t2{color:var(--text2)}.t3{color:var(--text3)}
.small{font-size:14px;line-height:1.43}
.xs{font-size:12.5px;line-height:1.4}
.center{text-align:center}
.mb{margin-bottom:12px}
.ic{width:20px;height:20px;flex:none}
.spacer{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.scroll{overflow-x:auto}

/* Franja institucional (igual que el original) */
header.band{display:flex;align-items:center;gap:16px;background:var(--band);color:#fff;padding:10px 20px;min-height:72px;flex:none}
header.band img.usm{height:40px;width:auto}
header.band img.fac{height:50px;width:auto}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 18px;border-radius:999px;font-size:15px;font-weight:500;background:var(--blue);color:#fff;transition:background .15s,transform .15s,box-shadow .15s;text-align:center;line-height:1.2}
.btn:hover{background:var(--blue-h)}
.btn:active{transform:scale(.98)}
.btn .ic{width:18px;height:18px}
.btn.sec{background:var(--fill2);color:var(--text)}
.btn.sec:hover{background:#DEDEE3}
.btn.ghost{background:none;color:var(--blue);padding:8px 4px;min-height:36px}
.btn.ghost:hover{text-decoration:underline}
.btn.danger{background:none;color:var(--red);padding:8px 4px}
.btn.danger:hover{background:var(--red-t);padding:8px 12px}
.btn.sm{min-height:34px;padding:6px 14px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.iconbtn{width:34px;height:34px;border-radius:50%;background:var(--fill2);color:var(--text2);display:inline-grid;place-items:center;flex:none}
.iconbtn:hover{background:#DEDEE3;color:var(--text)}
.iconbtn .ic{width:17px;height:17px}

/* Píldoras */
.pill{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--fill);color:var(--text2);align-self:flex-start;line-height:1.25}
.pill .ic{width:14px;height:14px}
.pill.ok{background:var(--green-t);color:var(--green)}
.pill.warn{background:var(--orange-t);color:var(--orange)}
.pill.bad{background:var(--red-t);color:var(--red)}
.pill.info{background:var(--blue-t);color:var(--blue-d)}
.dot{width:7px;height:7px;border-radius:50%;background:#34C759;flex:none}
.eyebrow{font-size:13px;font-weight:600;color:var(--blue);letter-spacing:0}

/* Tarjetas */
.card{background:var(--card);border-radius:20px;padding:24px;box-shadow:var(--sh1);border:1px solid rgba(0,0,0,.035)}
.itile{width:44px;height:44px;border-radius:12px;background:linear-gradient(160deg,#2A93FF 0%,#0071E3 58%,#0060CC 100%);color:#fff;display:inline-grid;place-items:center;flex:none;box-shadow:0 2px 6px rgba(0,113,227,.22),inset 0 1px 0 rgba(255,255,255,.18)}
.itile .ic{stroke-width:1.9}
.itile .ic{width:22px;height:22px}
.itile.sm{width:36px;height:36px;border-radius:10px}
.itile.sm .ic{width:19px;height:19px}
.itile.lg{width:60px;height:60px;border-radius:18px}
.itile.lg .ic{width:28px;height:28px}
.itile.gray{background:linear-gradient(160deg,#C7C7CC,#A1A1A8);color:#fff;box-shadow:none}
.av-m{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.folio{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:8px;background:var(--blue-t);color:var(--blue-d);font-weight:600;font-size:.92em;line-height:1.5;vertical-align:baseline;white-space:nowrap;transition:background .15s}
.folio:hover{background:#D6E6FB}
.folio .ic{width:14px;height:14px}

/* Acceso */
.auth{max-width:1120px;margin:0 auto;padding:48px 24px 24px}
.auth.narrow{max-width:480px;padding-top:56px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:48px;align-items:center;margin-bottom:56px}
.hero-txt{display:flex;flex-direction:column;gap:16px}
.display{font-size:56px;line-height:1.05;font-weight:700;letter-spacing:-.035em}
.lead{font-size:21px;line-height:1.38;color:var(--text2);letter-spacing:-.015em;max-width:460px}
.hero-vis{position:relative;border-radius:28px;aspect-ratio:16/11;background:#EDE9E3 center/cover no-repeat;box-shadow:var(--sh2);overflow:hidden}
.hero-av{position:absolute;left:28px;bottom:28px;width:168px;height:168px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 12px 32px rgba(0,0,0,.18)}
.glass{position:absolute;right:24px;top:24px;display:flex;flex-direction:column;gap:2px;padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 8px 24px rgba(0,0,0,.1);border:1px solid rgba(255,255,255,.6)}
.glass b{font-size:20px;letter-spacing:-.02em}
.roles-wrap h2{font-size:28px;letter-spacing:-.025em;font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px;margin-top:20px}
.role{display:flex;flex-direction:column;gap:8px;text-align:left;background:#fff;border-radius:20px;padding:20px;box-shadow:var(--sh1);border:1px solid rgba(0,0,0,.035);transition:transform .25s var(--ease),box-shadow .25s var(--ease);min-height:210px}
.role:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.role .itile{margin-bottom:6px}
.role .go{margin-top:auto;display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:500;font-size:14.5px;padding-top:8px}
.role .go .ic{width:16px;height:16px}
.authcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:36px 32px}
.authcard h1{font-size:28px}
.otp{display:flex;gap:10px;justify-content:center;margin:8px 0 2px}
.otp input{width:48px;height:58px;text-align:center;font-size:26px;font-weight:600;border-radius:14px;border:1px solid var(--sep2);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;padding:0}
.otp input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.18)}
.democode{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--fill);border-radius:14px;padding:10px 18px;width:100%}
.democode b{font-size:22px;letter-spacing:.12em}
.err{display:flex;align-items:center;gap:8px;color:var(--red);font-weight:500;font-size:15px}

/* Estructura de la app */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:264px minmax(0,1fr)}
aside.sb{display:flex;flex-direction:column;gap:4px;padding:18px 12px 16px;background:#FBFBFD;border-right:1px solid var(--sep);overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px}
.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.brand b{display:block;font-size:17px;letter-spacing:-.015em}
.brand span{display:block;font-size:12px;color:var(--text2);line-height:1.3}
.ng{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.nl{font-size:11.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:6px 10px 4px}
.nv{display:flex;align-items:center;gap:11px;width:100%;min-height:38px;padding:7px 10px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--text);text-align:left;transition:background .12s}
.nv .ic{width:19px;height:19px;color:var(--text2)}
.nv:hover{background:rgba(0,0,0,.045)}
.nv.on{background:var(--blue);color:#fff}
.nv.on .ic{color:#fff}
.nv .lk{margin-left:auto;display:inline-flex;color:var(--text3)}
.nv .lk .ic{width:15px;height:15px;color:inherit}
.nv.on .lk{color:rgba(255,255,255,.8)}
.nv .nt{width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;flex:none;background:linear-gradient(160deg,#2A93FF 0%,#0071E3 58%,#0060CC 100%);box-shadow:0 1px 2px rgba(0,60,140,.25),inset 0 1px 0 rgba(255,255,255,.18)}
.nv .nt .ic{width:16px;height:16px;color:#fff;stroke-width:2}
.nv.on .nt{background:#fff;box-shadow:none}
.nv.on .nt .ic{color:var(--blue)}
.nv.lockd .nt{background:linear-gradient(160deg,#C7C7CC,#A1A1A8);box-shadow:none}
.nv.lockd>span:not(.nt):not(.lk){color:var(--text2)}
.me{display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid var(--sep);margin-top:6px}
.me b{display:block;font-size:13.5px;line-height:1.3}
.me span{display:block;font-size:12px;color:var(--text2)}
.content{overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.tb{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 32px;min-height:62px;background:rgba(245,245,247,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--sep)}
.crumb{display:flex;align-items:baseline;gap:10px;min-width:0}
.crumb b{font-size:15px;white-space:nowrap}
.crumb span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .pill,.tb .btn{white-space:nowrap;flex:none}
body.gopen .tb .pill{display:none}
.mnav{display:none}
.show-s{display:none!important}
.page{padding:32px 32px 40px;width:100%;max-width:1200px;flex:1}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.head>div:first-child{flex:1;min-width:240px}
.head .sub{color:var(--text2);margin-top:6px;font-size:16px}
.head-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
footer.foot{padding:20px 32px 28px;font-size:12.5px;color:var(--text3);line-height:1.5;max-width:1200px}
.auth+footer.foot,.auth~footer.foot{margin:0 auto;max-width:1120px;padding:12px 24px 36px}

/* Control segmentado */
.seg{display:inline-flex;background:var(--fill2);border-radius:10px;padding:2px}
.seg button{min-height:32px;padding:5px 14px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text);transition:background .15s}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);cursor:default}

/* Inicio */
.kpi{min-height:250px}
.kpi>.btn{margin-top:auto;align-self:flex-start}
.ringrow{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap}
.ringrow p{flex:1;min-width:130px}
.ringbox{position:relative;width:96px;height:96px;flex:none}
.ringbox svg{width:100%;height:100%;display:block}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ringc b{font-size:32px;font-weight:700;letter-spacing:-.03em}
.ringc span{font-size:11.5px;color:var(--text2);margin-top:3px}
.stat{font-size:46px;font-weight:700;line-height:1.02;letter-spacing:-.035em}
.stat.md{font-size:26px;letter-spacing:-.025em;line-height:1.15}
.big{font-size:19px;line-height:1.5;letter-spacing:-.015em}
.big2{font-size:17px;line-height:1.5}
.lastact{display:flex;gap:16px;align-items:flex-start;margin-top:16px}

/* Línea de tiempo */
.tl{display:flex;flex-direction:column}
.st{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:center;padding:9px 0;position:relative}
.st:not(:last-child)::after{content:"";position:absolute;left:13px;top:41px;bottom:-9px;width:2px;background:var(--fill2);border-radius:2px}
.st.done:not(:last-child)::after{background:var(--blue)}
.mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 2px var(--fill2)}
.st.done .mk{background:var(--blue);color:#fff;box-shadow:none}
.st.done .mk .ic{width:15px;height:15px;stroke-width:2.6}
.st.now .mk{box-shadow:inset 0 0 0 2px var(--blue)}
.st.now .mk i{width:10px;height:10px;border-radius:50%;background:var(--blue)}
.stn{font-weight:500}
.st.next .stn{color:var(--text2)}

/* Tablas */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px}
.tbl th{font-weight:600;color:var(--text2);font-size:12.5px;text-align:left;padding:8px 12px;border-bottom:1px solid var(--sep);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--sep);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.badrow td{background:var(--red-t)}
.tbl td.hashc{font-size:12.5px;color:var(--text2);letter-spacing:.02em}

/* Resumen */
.sitem{display:flex;flex-direction:column;gap:12px;padding:20px 22px}

/* Calendario */
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
.mh{text-transform:capitalize;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:11.5px;text-align:center;font-weight:600;color:var(--text3);padding-bottom:4px}
.day{min-height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:500;line-height:1.1;width:100%;color:var(--text);background:none}
.day small{font-size:10px;font-weight:600;margin-top:2px;color:var(--text2);letter-spacing:0}
.day.w{color:var(--text3);font-weight:400}
.day.d{background:var(--blue-t);color:var(--blue-d)}
.day.d small{color:var(--blue-d)}
.day.c{background:var(--text);color:#fff}
.day.c small{color:rgba(255,255,255,.8)}
.day.off{background:var(--fill);color:var(--text3);text-decoration:line-through}
.day.off small{text-decoration:none}
.day.end{background:var(--blue);color:#fff;font-weight:700}
.day.end small{color:#fff}
.day.today{box-shadow:inset 0 0 0 2px var(--text)}
.day.edit{cursor:pointer;transition:transform .12s}
.day.edit:hover{box-shadow:inset 0 0 0 2px var(--blue)}
.day.edit.today:hover{box-shadow:inset 0 0 0 2px var(--blue)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--text2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.lg{width:14px;height:14px;border-radius:4px;display:inline-block}
.lg.c{background:var(--text)}.lg.d{background:var(--blue-t);box-shadow:inset 0 0 0 1px #C9DDF7}.lg.off{background:var(--fill2)}.lg.end{background:var(--blue)}.lg.today{box-shadow:inset 0 0 0 2px var(--text)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--blue-t);color:var(--blue-d);font-weight:600;font-size:14px;display:grid;place-items:center}

/* Chat */
.chatcard{padding:0;overflow:hidden;display:flex;flex-direction:column}
.chat{display:flex;flex-direction:column;gap:14px;min-height:320px;max-height:56vh;overflow:auto;padding:24px}
.msg{display:flex;gap:10px;max-width:84%}
.msg.u{align-self:flex-end}
.msg.b{align-self:flex-start;align-items:flex-end}
.msg.b>img{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.bwrap{display:flex;flex-direction:column;gap:6px;min-width:0}
.bub{padding:11px 15px;border-radius:20px;font-size:15.5px;line-height:1.45;overflow-wrap:anywhere}
.msg.u .bub{background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.msg.b .bub{background:#E9E9EB;color:var(--text);border-bottom-left-radius:6px}
.msg.stop .bub{background:var(--orange-t)}
.msg.urg .bub{background:var(--red-t)}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;align-self:flex-start}
.flag .ic{width:14px;height:14px}
.flag.warn{color:var(--orange)}.flag.bad{color:var(--red)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:12.5px;color:var(--text3);padding-left:4px}
.lnk{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:500;font-size:12.5px}
.lnk .ic{width:14px;height:14px}
.lnk:hover{text-decoration:underline}
.composer{display:flex;align-items:center;gap:8px;margin:0 16px 16px;background:#fff;border:1px solid var(--sep2);border-radius:999px;padding:5px 5px 5px 18px;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.15)}
.composer input:focus,.composer input:focus-visible{outline:none;box-shadow:none;border:0}
.composer input,.composer input[type=text]{flex:1;min-width:0;width:auto;border:0;outline:0;background:none;box-shadow:none;font-size:16px;padding:8px 0;border-radius:0}
.sendbtn{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;transition:background .15s}
.sendbtn:hover{background:var(--blue-h)}
.sendbtn .ic{width:18px;height:18px;stroke-width:2.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--fill);color:var(--text);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;min-height:38px;text-align:left;transition:background .15s}
.chip:hover{background:var(--fill2)}
.chip.deny{background:#fff;box-shadow:inset 0 0 0 1px var(--sep2)}
.chip.deny:hover{background:var(--fill)}
.ctitle{display:flex;align-items:center;gap:8px}
.ctitle .ic{color:var(--text2)}

/* Prueba de tiempo */
.foliogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.fg{background:var(--fill);min-height:56px;border-radius:12px;font-weight:600;font-size:16px;transition:background .12s,transform .12s}
.fg:hover{background:var(--blue-t);color:var(--blue-d)}
.fg:active{transform:scale(.96)}
.fg.seen{background:#fff;color:var(--text3);box-shadow:inset 0 0 0 1px var(--sep)}

/* Seguridad */
.paper{background:#fff;border:1px solid var(--sep2);border-radius:14px;padding:16px 18px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.paper-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:-4px}
.paper-h .ic{width:15px;height:15px}
.hidden-ins{background:var(--red-t);color:var(--red);font-weight:600;border-radius:4px}
.hash{font-size:12.5px;color:var(--text2);overflow-wrap:anywhere;background:var(--fill);border-radius:10px;padding:10px 12px;letter-spacing:.03em;line-height:1.5}
.lbl{font-weight:600;font-size:14.5px}

/* ========== SHA-256 propio: funciona igual al abrir el archivo sin servidor ========== */
function sha256(str){
 const b=Array.from(new TextEncoder().encode(str));const K=[];let isP=n=>{for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};
 let H=[],n=2;while(K.length<64){if(isP(n)){if(H.length<8)H.push((Math.pow(n,1/2)%1)*4294967296>>>0);K.push((Math.pow(n,1/3)%1)*4294967296>>>0)}n++}
 const l=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);
 const hi=Math.floor(l/4294967296),lo=l>>>0;[hi>>>24,hi>>>16&255,hi>>>8&255,hi&255,lo>>>24,lo>>>16&255,lo>>>8&255,lo&255].forEach(x=>b.push(x));
 const r=(x,y)=>(x>>>y)|(x<<(32-y));
 for(let i=0;i<b.length;i+=64){const w=[];for(let t=0;t<16;t++)w[t]=(b[i+4*t]<<24|b[i+4*t+1]<<16|b[i+4*t+2]<<8|b[i+4*t+3])>>>0;
  for(let t=16;t<64;t++){const s0=r(w[t-15],7)^r(w[t-15],18)^(w[t-15]>>>3),s1=r(w[t-2],17)^r(w[t-2],19)^(w[t-2]>>>10);w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0}
  let[a,c1,c,d,e,f,g,h]=H;
  for(let t=0;t<64;t++){const S1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&g),T1=(h+S1+ch+K[t]+w[t])>>>0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&c1)^(a&c)^(c1&c),T2=(S0+mj)>>>0;h=g;g=f;f=e;e=(d+T1)>>>0;d=c;c=c1;c1=a;a=(T1+T2)>>>0}
  H=[H[0]+a,H[1]+c1,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x>>>0)}
 return H.map(x=>x.toString(16).padStart(8,"0")).join("");
}

function computeLapso(off){
 const dias=[];let d=dt(CITA);
 while(dias.length<LAPSO){d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);const w=d.getDay(),k=iso(d);if(w!==0&&w!==6&&!off.has(k))dias.push(k)}
 const transcurridos=dias.filter(x=>x<=DEMO_HOY).length;
 return{dias,transcurridos,restantes:LAPSO-transcurridos,vence:dias[LAPSO-1]};
}

const otpVal=()=>[...document.querySelectorAll("[data-otp]")].map(i=>i.value).join("");
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="es-VE";speechSynthesis.speak(u)}catch(e){S.modal=modalMsg("Lectura en voz alta","Este navegador no ofrece lectura en voz alta.")}}
function go(s){S.screen=s;if(!can(s))logEv("Acceso denegado a "+SCREENS.find(x=>x[0]===s)[1]);}
const A={
 go:v=>go(v),
 pick:v=>{S.pending=v;S.codeErr=false},
 fillcode:()=>{document.querySelectorAll("[data-otp]").forEach((x,k)=>x.value=CODE[k]);const b=$("#verifyBtn");if(b)b.focus();return"keep"},
 verify:()=>{const v=otpVal();if(v===CODE){S.role=S.pending;S.pending=null;S.screen="inicio";logEv("Inicio de sesión con doble factor")}else{S.codeErr=true;logEv("Código de verificación incorrecto")}},
 cancelcode:()=>{S.pending=null},
 logout:()=>{logEv("Cierre de sesión");S.role=null;S.simple=false;S.idShown=false;S.chat=[]},
 guide:()=>{S.guide=!S.guide},

 close:()=>{S.modal=null},

 day:v=>{if(S.off.has(v))S.off.delete(v);else S.off.add(v);logEv("Calendario modificado: "+fLarga(v))},
 send:()=>{const i=$("#q");if(i)ask(i.value)},
 q:v=>ask(v),
 speak:v=>{speak(S.chat[+v].b);return"keep"},
 others:()=>{logEv("Acceso denegado a preguntas de otra parte");S.modal=modalMsg("Acceso denegado","Las preguntas de cada persona son confidenciales. Ni el juez ni la contraparte pueden verlas. La bitácora registra el acceso, no el contenido.")},
 clearchat:()=>{S.chat=[]},
 ta:()=>{const a=[];for(let i=1;i<=60;i++)a.push(i);for(let i=59;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}Object.assign(S.time,{mode:"a",order:a,seen:[],last:null,start:performance.now()})},
 tf:v=>{const n=+v;if(n===47){S.time.a=performance.now()-S.time.start;S.time.mode=null;logEv("Prueba de tiempo sin asistente finalizada")}else{if(!S.time.seen.includes(n))S.time.seen.push(n);S.time.last=n}},
 tbs:()=>{Object.assign(S.time,{mode:"b",start:performance.now()})},
 tb:v=>{if(+v===47){S.time.b=performance.now()-S.time.start;S.time.mode=null;logEv("Prueba de tiempo con Tamara finalizada")}},
 tcancel:()=>{S.time.mode=null},
 treset:()=>{Object.assign(S.time,{mode:null,a:null,b:null})},
 inj:()=>{const hit=scan(F52V+" "+F52H);S.sec.result={hit};logEv("Instrucción oculta detectada en el folio 52: marcado para revisión")},
 inj2:()=>{const t=$("#inj2").value;S.sec.custom=t;const hit=scan(t);S.sec.result={hit};logEv(hit?"Instrucción detectada en texto de prueba":"Texto de prueba analizado")},
 reveal:()=>{S.sec.reveal=!S.sec.reveal},
 hash:()=>{const t=$("#ht").value;S.sec.hashText=t;const h=sha256(t);S.sec.hashRes={ok:h===HASH47,h};logEv(h===HASH47?"Integridad del folio 47 verificada":"Alteración detectada en el folio 47")},
 tamper:()=>{const t=$("#ht");S.sec.hashText=t.value.replace("20 de octubre","28 de octubre");S.sec.hashRes=null},
 restore:()=>{S.sec.hashText=F47;S.sec.hashRes=null},
 chain:()=>{S.chainOk=verifyChain()},
 breaklog:()=>{if(S.log.length<2)return;const i=Math.max(0,S.log.length-2);S.tamper={i,acc:S.log[i].accion};S.log[i].accion="Entrada manipulada";S.chainOk=null},
 fixlog:()=>{if(S.tamper){S.log[S.tamper.i].accion=S.tamper.acc;S.tamper=null;S.chainOk=null}},
 gstep:v=>{const i=+v,g=GUIDE[i];if(S.role!==g.r){S.role=g.r;S.pending=null;S.simple=false;S.idShown=false;logEv("Inicio de sesión (guía de demostración)")}S.modal=null;go(g.s);S.done[i]=true;if(g.q){S.chat=[];ask(g.q)}if(g.s==="tiempo")S.time.mode=null},
 reset:()=>{Object.assign(S,{role:null,screen:"inicio",pending:null,codeErr:false,simple:false,summary:initialSummary(),off:initOff(),log:[],chat:[],modal:null,done:{},tamper:null,chainOk:null,idShown:false,sec:{text:null,result:null,custom:"",hashText:F47,hashRes:null},time:{mode:null,start:0,a:null,b:null,seen:[],elapsed:0}})}
};

 if(f.size>10485760)return aviso("Archivo muy grande","El máximo es 10 MB.");

 try{const huella=await sha256Hex(await f.arrayBuffer()),folio=fo;

  c.toBlob(b=>b?ok(b):mal(new Error("No se pudo preparar la imagen.")),"image/jpeg",0.86)};

/* ========== Burbuja de ayuda: orientación para cualquier persona, sin entrar ========== */
ON.ayuda=[];ON.ayudaOpen=false;
const AYUDA_SUG=["¿Qué es un día de despacho?","¿Qué significa que me citaron?","¿Qué pasa si no contesto?","¿Qué sigue después?","¿Dónde consigo un abogado?","¿Voy a ganar el juicio?"];
function ayudaHTML(){
 if(!ON.ayudaOpen)return `<button class="ayuda-fab" data-act="ayuda" aria-label="Abrir la ayuda de orientación">${ic("chat")}<span>¿Necesita ayuda?</span></button>`;
 const bot=(t,cls,src)=>`<div class="msg b ${cls||""}">${emb("sm")}<div class="bwrap">${cls==="stop"?`<span class="flag warn">${ic("shieldalert")}Fuera de los límites del asistente</span>`:cls==="urg"?`<span class="flag bad">${ic("buoy")}Requiere atención de una persona</span>`:""}<div class="bub">${esc(t)}</div>${src?`<div class="meta"><span>Fuente: ${esc(src)}</span></div>`:""}</div></div>`;
 return `<section class="ayuda-panel" role="dialog" aria-label="Orientación"><div class="ayuda-hd">${emb("md")}<div><b>Orientación</b><span class="xs t2">Explico el proceso. No asesoro sobre su caso.</span></div><button class="iconbtn" data-act="ayuda" aria-label="Cerrar la ayuda">${ic("x")}</button></div>
<div class="chat ayuda-chat" aria-live="polite">${bot("Hola, soy Tamara. Pregúnteme cómo funciona un proceso en el tribunal. No puedo decirle si va a ganar ni qué le conviene.")}${ON.ayuda.map(m=>m.u!==undefined?`<div class="msg u"><div class="bub">${esc(m.u)}</div></div>`:bot(m.b,m.cls,m.src)).join("")}</div>
<div class="ayuda-sug">${AYUDA_SUG.map(c=>`<button class="chip" data-act="ayudaq" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>
<div class="composer"><input id="qa" type="text" aria-label="Escriba su pregunta" placeholder="Escriba su pregunta" data-enter="ayudasend" autocomplete="off"><button class="sendbtn" data-act="ayudasend" aria-label="Enviar">${ic("up")}</button></div>
<p class="xs t3 ayuda-pie">Orientación general. No sustituye a un abogado ni representa la opinión del tribunal.</p></section>`}
const ayudaAbajo=()=>{const c=$(".ayuda-chat");if(c)c.scrollTop=c.scrollHeight;const i=$("#qa");if(i)i.focus()};
function preguntaPublica(q){q=String(q||"").trim().slice(0,300);if(!q)return;const rol=S.role;S.role=rol||"tercero";let r;try{r=answer(q)}finally{S.role=rol}
 ON.ayuda.push({u:q},{b:r.text,cls:r.cls,src:r.src});if(ON.ayuda.length>40)ON.ayuda.splice(0,ON.ayuda.length-40)}
A.ayuda=()=>{ON.ayudaOpen=!ON.ayudaOpen;if(ON.ayudaOpen)setTimeout(ayudaAbajo,0)};
A.ayudaq=v=>{preguntaPublica(v);setTimeout(ayudaAbajo,0)};
A.ayudasend=()=>{const i=$("#qa");if(i)preguntaPublica(i.value);setTimeout(ayudaAbajo,0)};

/* ========== Página del tribunal: portada y avisos (los edita el administrador) ========== */
const PAG_DEF={eyebrow:"Asistente virtual tribunalicio",titulo:"Hola, soy Tamara.",frase:"Oriento sobre el proceso. No asesoro sobre el caso. Nunca decido.",chip1:"Conectada al tribunal",chip2:"Juzgado Demo · Casos ficticios",entrarT:"Entre con su cuenta",entrarS:"Cada perfil ve solo lo que le corresponde.",avisosT:"Para leer",fotos:[]};
/* Fotos que cambian solas (suave, como Apple). Están en la carpeta pública "pagina" de la base */
const FONDO_URL=n=>SB_URL+"/storage/v1/object/public/pagina/fondos/"+n+".jpg";
const FONDOS_DEF=[1,2,3,4,5].map(i=>FONDO_URL("pub_"+i)),FONDOS_ADM=[1,2,3,4].map(i=>FONDO_URL("adm_"+i));
const FONDOS_LOCAL=["","",""].filter(Boolean);
const fondosPag=p=>{if(LOCAL&&FONDOS_LOCAL.length&&!(Array.isArray(p.fotos)&&p.fotos.filter(okFoto).length))return FONDOS_LOCAL;const l=Array.isArray(p.fotos)?p.fotos.filter(okFoto).slice(0,8):[];return l.length?l:FONDOS_DEF};
let slideI=0;
function slidesHTML(f){const i=slideI%f.length;return f.map((u,k)=>`<div class="slide${k===i?" on":""}" style="background-image:url('${u}')"></div>`).join("")+(f.length>1?`<div class="dots" aria-hidden="true">${f.map((u,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>`:"")}
setInterval(()=>{if(document.hidden)return;const vs=document.querySelectorAll(".fondo");if(!vs.length)return;slideI++;
 vs.forEach(el=>{const sl=el.querySelectorAll(".slide"),d=el.querySelectorAll(".dots i");if(sl.length<2)return;const i=slideI%sl.length;sl.forEach((x,k)=>x.classList.toggle("on",k===i));d.forEach((x,k)=>x.classList.toggle("on",k===i))})},6000);
const PAG=()=>{const p=Object.assign({},PAG_DEF),d=ON.pag||{};Object.keys(PAG_DEF).forEach(k=>{if(d[k]!==undefined&&d[k]!==null)p[k]=d[k]});return p};
const okFoto=u=>typeof u==="string"&&(u.indexOf(SB_URL+"/storage/v1/object/public/pagina/")===0||(LOCAL&&u.indexOf("data:image/")===0))&&!/['"()\\\s]/.test(u);
function heroTexto(p,o){o=o||{};const H=o.h||"h1";return `<div class="hero-txt">${p.eyebrow?`<span class="eyebrow">${esc(p.eyebrow)}</span>`:""}<${H} class="display">${esc(p.titulo||"")}</${H}>${p.frase?`<p class="lead">${esc(p.frase)}</p>`:""}${p.chip1||p.chip2?`<div class="row hchips">${p.chip1?`<span class="pill"><span class="dot"></span>${esc(p.chip1)}</span>`:""}${p.chip2?`<span class="pill">${ic("folder")}${esc(p.chip2)}</span>`:""}</div>`:""}${o.extra?`<div class="row hbtns">${o.extra}</div>`:""}</div>`}
function heroImagen(p){return `<div class="hero-vis fondo" role="img" aria-label="Imágenes del tribunal">${slidesHTML(fondosPag(p))}</div>`}
const portadaHero=(p,o)=>`<section class="hero${o&&o.cls?" "+o.cls:""}">${heroTexto(p,o)}${heroImagen(p)}</section>`;
function heroInicio(c,L,extra){const p=PAG(),n=ON.activo&&!ON.preview&&ON.perfil&&ON.perfil.nombre?ON.perfil.nombre.split(" ")[0]:"";
 const q=Object.assign({},p,{titulo:n?"Hola, "+n+".":p.titulo});if(c)Object.assign(q,{eyebrow:"Exp. "+c.id+" · "+c.materia,chip2:TRIB});
 return portadaHero(q,{h:c?"h1":"h2",cls:"mini",extra:extra})}
const fechaAviso=d=>{try{return new Date(d).toLocaleDateString("es-VE",{day:"numeric",month:"long",year:"numeric"})}catch(e){return""}};
function avisosHTML(lista,titulo,envolver){const l=(lista||[]).filter(a=>a.visible!==false);if(!l.length)return"";
 const h=`<section class="avisos">${titulo?`<h2>${esc(titulo)}</h2>`:""}<div class="avgrid">${l.map(a=>`<article class="card aviso">${okFoto(a.imagen)?`<img class="avimg" src="${a.imagen}" alt="">`:""}<div class="stack" style="gap:6px">${a.creado?`<span class="xs t3">${fechaAviso(a.creado)}</span>`:""}<h3>${esc(a.titulo)}</h3>${a.texto?`<p class="small t2 avtxt">${esc(a.texto).replace(/\n/g,"<br>")}</p>`:""}</div></article>`).join("")}</div></section>`;
 return envolver?`<div class="auth avwrap">${h}</div>`:h}
const AV_PUB="/rest/v1/avisos?visible=eq.true&select=id,titulo,texto,imagen,visible,orden,creado&order=orden,creado.desc";
const quieto=()=>{const a=document.activeElement;return !(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))};
async function cargarPagina(){try{const r=await Promise.all([sbFetch("/rest/v1/pagina?clave=eq.tribunal&select=datos",{auth:false}),sbFetch(AV_PUB,{auth:false})]);ON.pag=(r[0]&&r[0][0]&&r[0][0].datos)||{};ON.avisos=r[1]||[]}catch(e){if(!ON.pag)ON.pag={};if(!ON.avisos)ON.avisos=[]}if(quieto())render()}
const recargarAvisosPublicos=()=>sbFetch(AV_PUB,{auth:false}).then(r=>{ON.avisos=r||[]},()=>{});
function fueraDeLugar(){const adm=!!(ON.perfil&&ON.perfil.rol==="admin");
 if(MODO==="admin"&&!adm)return "Esta página es solo para la administración. Las demás cuentas entran por la página del tribunal: "+URL_TRIB.slice(8);
 if(MODO==="tribunal"&&adm)return "Esta cuenta es de administración y entra por su propia página.";return""}
function entrarCompacto(f,dis,err,msg){const p=PAG();return `<form class="stack fbform compacto" data-submit="entrar" novalidate>${p.entrarT?`<h2 class="pth">${esc(p.entrarT)}</h2>`:""}${p.entrarS?`<p class="small t2 ptsub">${esc(p.entrarS)}</p>`:""}${msg}
<div class="g2c"><input type="text" id="lEmail" placeholder="Usuario" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(f.email||"")}" aria-label="Usuario"><input type="password" id="lPass" placeholder="Contraseña" autocomplete="current-password" aria-label="Contraseña"></div>${err}
<button class="btn block lg" type="submit"${dis}>${ON.ocupado?"Entrando...":"Iniciar sesión"}</button>
<p class="xs t2 ptnota">Su cuenta la crea la administración del tribunal.</p></form>`}
function viewPortada(fresh,form,reg){const p=PAG(),dis=ON.ocupado?" disabled":"",navs=(ON.avisos||[]).filter(a=>a.visible!==false).length;
 const rap=ACCESO_RAPIDO&&!reg?`<div class="ptrap"><span class="xs t2">Acceso rápido de demostración</span><div class="rrow">${RAPIDO.map(([u,n,i])=>`<button class="rchip" data-act="rapido" data-v="${u}"${dis}>${ic(i)}${n}</button>`).join("")}</div></div>`:"";
 return `<div class="pantalla">`+band()+`<div class="auth fit${fresh?" anim":""}"><section class="portada"><div class="pt-izq">${heroTexto(p)}<div class="card ptlogin">${form}</div>${rap}${navs?`<button class="btn sec sm ptavisos" data-act="veravisos">${ic("book")}${esc(p.avisosT||"Para leer")}<span class="ufn">${navs}</span></button>`:""}</div><div class="pt-der">${heroImagen(p)}</div></section></div>`+foot()+ayudaHTML()+`</div>`}
A.veravisos=()=>{S.modal=()=>`<div class="overlay" data-act="close"><div class="modal stack mavisos" role="dialog" aria-modal="true" aria-label="Avisos"><div class="mhd"><span class="itile sm">${ic("book")}</span><h2 style="flex:1">${esc(PAG().avisosT||"Para leer")}</h2><button class="iconbtn" data-act="close" aria-label="Cerrar">${ic("x")}</button></div>${avisosHTML(ON.avisos,"")||'<p class="t2">No hay avisos por ahora.</p>'}</div></div>`};
async function iniciar(){cargarPagina();const t=leerSesion();ON.restaurando=!!t;render();if(!t)return;ON.tok=t;
 try{if(!(await refrescar()))throw new Error("sesión vencida");await cargarOnline();if(fueraDeLugar())throw new Error("lugar");S.role=ON.perfil.rol;S.pending=null;
  let v=null;try{v=JSON.parse(sessionStorage.getItem(VISTA_K)||"null")}catch(e){}
  if(v&&v.c&&v.c!==S.causa&&CAUSAS.some(c=>c.id===v.c))abrirCausa(v.c);
  S.screen=v&&v.s&&can(v.s)?v.s:landing();
  if(S.screen==="bitacora"){ON.bit=null;cargarBitacora()}}
 catch(e){ON.tok=null;guardarSesion(null);ON.activo=false;restaurarLocal()}
 ON.restaurando=false;render()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;
 if(t.classList.contains("overlay")&&e.target!==t)return;
 const ht=$("#ht"),i2=$("#inj2");if(ht)S.sec.hashText=ht.value;if(i2)S.sec.custom=i2.value;
 const r=A[t.dataset.act](t.dataset.v);if(r!=="keep")render();
 if(t.dataset.act==="send"){const i=$("#q");if(i)i.focus()}
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){if(S.modal){S.modal=null;render()}else if(S.guide){S.guide=false;render()}return}
 const t=e.target;
 if(t.dataset&&t.dataset.otp!==undefined&&e.key==="Backspace"&&!t.value){const p=document.querySelector(`[data-otp="${+t.dataset.otp-1}"]`);if(p){p.value="";p.focus();e.preventDefault()}return}
 if(e.key==="Enter"&&t.dataset&&t.dataset.enter){e.preventDefault();A[t.dataset.enter]();render();const i=$("#q");if(i)i.focus()}});
document.addEventListener("input",e=>{const t=e.target;if(!(t.dataset&&t.dataset.otp!==undefined))return;
 t.value=t.value.replace(/\D/g,"").slice(-1);
 if(t.value){const n=document.querySelector(`[data-otp="${+t.dataset.otp+1}"]`);if(n)n.focus()}
 if(otpVal().length===6){A.verify();render()}});
document.addEventListener("paste",e=>{const t=e.target;if(!(t.dataset&&t.dataset.otp!==undefined))return;e.preventDefault();
 const d=((e.clipboardData||window.clipboardData).getData("text")||"").replace(/\D/g,"").slice(0,6);const all=[...document.querySelectorAll("[data-otp]")];
 d.split("").forEach((ch,i)=>{if(all[i])all[i].value=ch});if(d.length===6){A.verify();render()}else if(all[d.length])all[d.length].focus()});
setInterval(()=>{const el=document.getElementById("clock");if(el&&S.time.mode)el.lastChild.textContent=((performance.now()-S.time.start)/1000).toFixed(1)+" s"},100);
iniciar();
</script>
</body>
</html>
